name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, release]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check commit message
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Test
        run: pnpm test

      # The edge function is Deno, not Node, so `pnpm test` cannot reach it.
      # Without this step its tests exist but never run.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --node-modules-dir=none is not optional: run inside this repo without
      # it and Deno misreads pnpm-workspace.yaml, then writes a "workspaces"
      # key into the root package.json as a "migration".
      #
      # The dummy values satisfy module-level Deno.env.get calls at import.
      # These tests are pure transformations that reach neither network nor
      # database, so no real credential is involved.
      - name: Test edge function
        env:
          MS_CLIENT_ID: unused
          MS_CLIENT_SECRET: unused
          GOOGLE_CLIENT_ID: unused
          GOOGLE_CLIENT_SECRET: unused
          TOKEN_ENCRYPTION_KEY: unused
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: unused
        run: >
          deno test --node-modules-dir=none --allow-env --allow-net
          supabase/functions/graph/index.test.ts
