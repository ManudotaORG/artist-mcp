project_id = "zxiemadwrkcoovvpscfb"

# Local Auth defaults. Hosted environments override these below so redirects
# stay deterministic and never depend on dashboard-only configuration.
[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[remotes.production]
project_id = "zxiemadwrkcoovvpscfb"

[remotes.production.auth]
site_url = "https://artist-mcp.vercel.app"
additional_redirect_urls = [
  "https://artist-mcp.vercel.app/**",
]

[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.production.auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[remotes.staging]
project_id = "cakkwvxwlkdfzqjbvrpa"

[remotes.staging.auth]
site_url = "https://artist-mcp-staging.vercel.app"
additional_redirect_urls = ["https://artist-mcp-staging.vercel.app/**"]

[remotes.staging.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.staging.auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[functions.graph]
# The caller presents a connection key, not a Supabase JWT, so the platform's
# JWT gate would reject every request before our code ran. Authentication is
# the sha256 key lookup against mcp_keys inside the function itself.
verify_jwt = false
