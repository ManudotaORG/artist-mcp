project_id = "zxiemadwrkcoovvpscfb"

# Local Auth defaults. Hosted environments override these in the remote blocks
# below, and those blocks are applied with
#
#   supabase config push --project-ref <ref>
#
# which selects the matching [remotes.*] block by project_id. The auth settings
# here are the settings that are live. Change them here and push; do not edit
# auth URLs in the dashboard, because a dashboard-only change is invisible to
# this file and the next push silently reverts it.
#
# `config push` covers api, db, auth, and storage.
#
# The top-level blocks are what `supabase start` uses, and local web
# development runs against that stack. It used to borrow a staging project,
# retired with its [remotes.staging] block in #194. See the Supabase section of
# docs/operations.md.
[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[remotes.production]
project_id = "zxiemadwrkcoovvpscfb"

[remotes.production.auth]
# Closed by default. A hosted server would make auth.users the gate on real
# provider credentials, so the account pool is named users only: they are
# created deliberately with the admin API, never by anyone who finds the form.
# Existing users can still request a magic link; only creation is refused.
enable_signup = false
site_url = "https://artist-mcp.vercel.app"
additional_redirect_urls = [
  "https://artist-mcp.vercel.app/**",
  # No localhost entry here, deliberately. A magic link that may redirect to a
  # developer's machine is a way to hand someone else a production session.
  # Local development uses `supabase start` instead, configured above.
]

[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.production.auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8
